<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carpenter Service Request</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" href="index.html">ALERT SERVICE</a>
  </div>
</nav>

<div class="container mt-5">
  <h2 class="text-center mb-4">Carpenter Service Form</h2>

  <div class="card p-4 shadow">

    <form id="carpForm">

      <div class="mb-3">
        <label class="form-label">Your Full Name</label>
        <input type="text" class="form-control" name="name" required placeholder="Enter your name">
      </div>

      <div class="mb-3">
        <label class="form-label">Phone Number</label>
        <input type="text" class="form-control" name="phone" required placeholder="Enter contact number">
      </div>

      <div class="mb-3">
        <label class="form-label">Required Work Type</label>
        <select class="form-select" name="workType" required>
          <option value="">Select</option>
          <option>Furniture Repair</option>
          <option>Door/Window Fix</option>
          <option>Bed / Table Assembly</option>
          <option>Plywood / Interior Work</option>
          <option>Custom Wood Work</option>
        </select>
      </div>

      <div class="mb-3">
        <label class="form-label">Problem Description</label>
        <textarea class="form-control" rows="3" name="description" placeholder="Describe issue" required></textarea>
      </div>

      <button type="submit" class="btn btn-dark w-100">Submit Request</button>

    </form>

    <div id="msg" class="text-success mt-3 text-center fw-bold"></div>

    <div class="text-center mt-3">
      <a href="index.html" class="btn btn-outline-dark btn-sm">Back to Services</a>
    </div>

  </div>
</div>

<script>
document.getElementById("carpForm").addEventListener("submit", async function(e){
    e.preventDefault();

    const data = {
        name: this.name.value,
        phone: this.phone.value,
        workType: this.workType.value,
        description: this.description.value
    }

    let res = await fetch("/api/carpenter", {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify(data)
    });

    let result = await res.json();
    document.getElementById("msg").innerText = result.message;
    this.reset();
});
</script>

</body>
</html>
