<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Geyser Service Request</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" href="index.html">HOME SERVICES</a>
  </div>
</nav>

<div class="container mt-5">
  <h2 class="text-center mb-4">Geyser Technician Booking</h2>

  <div class="card p-4 shadow">

    <form onsubmit="goThankYou(event)">

      <div class="mb-3">
        <label class="form-label">Your Name</label>
        <input type="text" class="form-control" placeholder="Enter your name" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Phone Number</label>
        <input type="text" class="form-control" placeholder="Enter contact number" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Issue Type</label>
        <select class="form-select" required>
          <option value="">Select Issue</option>
          <option>Geyser not heating</option>
          <option>Water leakage</option>
          <option>Electrical problem</option>
          <option>New installation</option>
        </select>
      </div>

      <div class="mb-3">
        <label class="form-label">Describe Problem</label>
        <textarea class="form-control" rows="3" placeholder="Describe problem" required></textarea>
      </div>

      <button type="submit" class="btn btn-dark w-100">Submit Request</button>

    </form>

    <div class="text-center mt-3">
      <a href="index.html" class="btn btn-outline-dark btn-sm">Back to Home</a>
    </div>

  </div>
</div>

<script>
function goThankYou(e){
  e.preventDefault();
  window.location.href = "thankyou.html";
}
</script>

</body>
</html>
