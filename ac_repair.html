<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AC Repair Request</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" href="index.html">HOME SERVICES</a>
  </div>
</nav>

<div class="container mt-5">
  <h2 class="text-center mb-4">AC Repair Request Form</h2>

  <div class="card p-4 shadow">

    <form id="acForm">

      <div class="mb-3">
        <label class="form-label">Your Full Name</label>
        <input type="text" class="form-control" name="name" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Phone Number</label>
        <input type="text" class="form-control" name="phone" required>
      </div>

      <div class="mb-3">
        <label class="form-label">AC Issue Type</label>
        <select class="form-select" name="issue" required>
          <option value="">Select</option>
          <option>Cooling Problem</option>
          <option>Gas Leakage</option>
          <option>Compressor Issue</option>
          <option>Water Leakage</option>
        </select>
      </div>

      <div class="mb-3">
        <label class="form-label">Description</label>
        <textarea class="form-control" name="description" rows="3" required></textarea>
      </div>

      <button type="submit" class="btn btn-dark w-100">Submit Request</button>

    </form>

  </div>
</div>

<script>
document.getElementById("acForm").addEventListener("submit", function(e){
  e.preventDefault();
  alert("AC Repair Request Submitted Successfully!");
  window.location = "index.html";
});
</script>

</body>
</html>
