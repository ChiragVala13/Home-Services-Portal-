<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Electrician Service Request</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" href="index.html">ALERT SERVICE</a>
  </div>
</nav>

<div class="container mt-5">

  <h2 class="text-center mb-4">Electrician Service</h2>

  <!-- step 1 choose type -->
  <div class="card p-4 shadow mb-4">
    <h5 class="text-center mb-3">You Are?</h5>

    <div class="d-grid gap-2">
      <button class="btn btn-dark" onclick="selectType('customer')">Customer / Need Electrician</button>
      <button class="btn btn-outline-dark" onclick="selectType('worker')">Electrician Worker</button>
    </div>
  </div>


  <!-- CUSTOMER FORM -->
  <div id="custFormDiv" class="card p-4 shadow d-none">

    <h5 class="text-center mb-3">Electrician Request Form</h5>

    <form id="electForm">

      <div class="mb-3">
        <label class="form-label">Your Full Name</label>
        <input type="text" class="form-control" name="name" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Phone Number</label>
        <input type="text" class="form-control" name="phone" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Required Work Type</label>
        <select class="form-select" name="workType" required>
          <option value="">Select</option>
          <option>Fan / Tube Repair</option>
          <option>Short Circuit Issue</option>
          <option>Switchboard Issue</option>
          <option>Wiring Installation / Fix</option>
          <option>Appliance Connection</option>
        </select>
      </div>

      <div class="mb-3">
        <label class="form-label">Problem Description</label>
        <textarea class="form-control" rows="3" name="description" required></textarea>
      </div>

      <button type="submit" class="btn btn-dark w-100">Submit Request</button>

    </form>

    <div id="msg" class="text-success mt-3 text-center fw-bold"></div>

    <div class="text-center mt-3">
      <button class="btn btn-outline-dark btn-sm" onclick="back()">Back</button>
    </div>

  </div>

  <!-- WORKER FORM -->
  <div id="workerFormDiv" class="card p-4 shadow d-none">

    <h5 class="text-center mb-3">Register as Electrician</h5>

    <form id="workerForm">

      <div class="mb-3">
        <label class="form-label">Full Name</label>
        <input type="text" class="form-control" name="wname" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Phone</label>
        <input type="text" class="form-control" name="wphone" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Your Work Specialty</label>
        <input type="text" class="form-control" name="wspecial" required>
      </div>

      <button type="submit" class="btn btn-dark w-100">Submit</button>
    </form>

    <div id="msg2" class="text-success mt-3 text-center fw-bold"></div>

    <div class="text-center mt-3">
      <button class="btn btn-outline-dark btn-sm" onclick="back()">Back</button>
    </div>

  </div>

</div>


<script>
function selectType(type){
  if(type==="customer"){
    custFormDiv.classList.remove("d-none");
    workerFormDiv.classList.add("d-none");
  }else{
    workerFormDiv.classList.remove("d-none");
    custFormDiv.classList.add("d-none");
  }
}

function back(){
  custFormDiv.classList.add("d-none");
  workerFormDiv.classList.add("d-none");
}

// customer submit
document.getElementById("electForm").addEventListener("submit", async function(e){
    e.preventDefault();
    
    let data = {
        name: this.name.value,
        phone: this.phone.value,
        workType: this.workType.value,
        description: this.description.value
    }

    let res = await fetch("/api/electrician", {
        method: "POST",
        headers: {"Content-Type":"application/json"},
        body: JSON.stringify(data)
    });

    document.getElementById("msg").innerText = (await res.json()).message;
    this.reset();
});

// worker submit
document.getElementById("workerForm").addEventListener("submit", async function(e){
    e.preventDefault();
    document.getElementById("msg2").innerText = "Worker Registration Saved ✅ (local only for now)";
    this.reset();
});
</script>

</body>
</html>
