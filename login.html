<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Login - Home Service Pro</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body{
      min-height:100vh;
      background: linear-gradient(135deg,#0b1020,#151726);
      color: #e7eef8;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
    }
    .card { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06); }
    .form-label { color: #dbe9ff; }
  </style>
</head>
<body>
<nav class="navbar navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand fw-bold" href="index.html">Home Service Pro</a>
    <div>
      <a class="btn btn-outline-light btn-sm" href="register.html">Register</a>
    </div>
  </div>
</nav>

<main class="container my-5">
  <div class="row justify-content-center">
    <div class="col-md-5">
      <div class="card p-4 shadow-sm">
        <h3 class="mb-3">Login</h3>
        <form id="loginForm" class="row g-3">
          <div class="col-12">
            <label class="form-label">Email</label>
            <input required name="email" type="email" class="form-control" placeholder="you@example.com">
          </div>
          <div class="col-12">
            <label class="form-label">Password</label>
            <input required name="password" type="password" class="form-control" placeholder="Your password">
          </div>

          <div class="col-12">
            <button id="loginBtn" type="submit" class="btn btn-primary w-100">Login</button>
          </div>
          <div class="col-12 text-center small text-muted">
            <a href="register.html">Create an account</a>
          </div>
        </form>
      </div>

      <div class="text-center text-muted mt-3 small">Demo login stores JWT locally for dashboard access.</div>
    </div>
  </div>
</main>

<footer class="text-center text-secondary mt-5 mb-4 small">
  © 2025 Home Service Pro
</footer>

<script>
  const API_BASE = '';

  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('loginBtn');
    btn.disabled = true;
    btn.innerText = 'Logging in...';

    const data = Object.fromEntries(new FormData(e.target).entries());

    try {
      const res = await fetch(API_BASE + '/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      });
      const json = await res.json();
      if (res.ok && json.token) {
        // store token and user
        localStorage.setItem('token', json.token);
        localStorage.setItem('user', JSON.stringify(json.user || {}));
        // redirect to dashboard
        window.location.href = 'dashboard.html';
      } else {
        alert(json.error || 'Login failed');
      }
    } catch (err) {
      alert('Network error: ' + err.message);
    } finally {
      btn.disabled = false;
      btn.innerText = 'Login';
    }
  });
</script>
</body>
</html>
