<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Doctor Service Request</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" href="index.html">ALERT SERVICE</a>
  </div>
</nav>

<div class="container mt-5">
  <h2 class="text-center mb-4">Doctor / Medical Request Form</h2>

  <div class="card p-4 shadow">

    <form id="doctorForm">

      <div class="mb-3">
        <label class="form-label">Your Full Name</label>
        <input type="text" name="name" class="form-control" placeholder="Enter your name" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Phone Number</label>
        <input type="text" name="phone" class="form-control" placeholder="Enter phone number" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Age</label>
        <input type="number" name="age" class="form-control" placeholder="Enter your age" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Required Specialization</label>
        <select name="specialization" class="form-select" required>
          <option value="">Select</option>
          <option>General Physician</option>
          <option>Cardiologist</option>
          <option>Dentist</option>
          <option>Neurologist</option>
          <option>ENT Specialist</option>
        </select>
      </div>

      <div class="mb-3">
        <label class="form-label">Symptoms / Issue</label>
        <textarea name="symptoms" class="form-control" rows="3" placeholder="Describe your symptoms" required></textarea>
      </div>

      <button type="submit" class="btn btn-dark w-100">Submit Request</button>

    </form>

    <div class="text-center mt-3">
      <a href="index.html" class="btn btn-outline-dark btn-sm">Back to Services</a>
    </div>

  </div>
</div>

<script>
document.getElementById("doctorForm").addEventListener("submit", async function(e){
  e.preventDefault();

  const formData = Object.fromEntries(new FormData(this).entries());

  const res = await fetch("http://localhost:5000/api/doctor", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(formData)
  });

  const data = await res.json();
  alert(data.message);
  this.reset();
});
</script>

</body>
</html>
